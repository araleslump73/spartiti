<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.webmanifest">
<link rel="shortcut icon" type="image/png" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Spartiti</title>
<script>
  // tema subito, per evitare il lampo bianco in modalità scura
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.className = "dark"; } catch (e) {}
</script>
<style>
  * { box-sizing: border-box; }
  html { font-size: 24px; }
  html, body { margin: 0; background: #fff; color: #000; font-family: sans-serif; }
  body { touch-action: pan-x pan-y; font-size: 1rem; }   /* niente zoom nativo: il pinch lo gestisce l'app */
  /* barra compatta; si nasconde scorrendo verso il basso e riappare scorrendo verso l'alto */
  #bar { position: sticky; top: 0; z-index: 10; background: #1a1a1a; color: #fff; display: flex; align-items: center; padding: 2px 3px; transition: transform .18s; }
  #bar.hid { transform: translateY(-105%); }
  #bar button { background: #444; color: #fff; border: 0; border-radius: 6px; font-size: 19px; min-width: 44px; height: 44px; margin: 0 2px; padding: 0 8px; flex: none; }
  #bar button:active { background: #777; }
  #bar button[hidden] { display: none; }
  #bar svg { width: 22px; height: 22px; vertical-align: middle; fill: none; stroke: #fff; stroke-width: 2.2; }
  #title { flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  #net { flex: none; font-size: 12px; padding: 2px 6px; border-radius: 9px; margin: 0 3px; background: #2e7d32; color: #fff; }
  #net.off { background: #e65100; }
  #info { background: #fff3cd; color: #4a3700; padding: 5px 10px; font-size: 15px; }
  #info:empty { display: none; }
  #info a { color: inherit; font-weight: bold; }
  #info button, .msg button, .act { font-size: 17px; padding: 6px 12px; margin: 3px 6px 3px 0; border: 1px solid #666; border-radius: 6px; background: #f2f2f2; color: #000; }
  #crumbs { background: #e6e6e6; padding: 3px 10px; font-size: 14px; line-height: 1.7; }
  #crumbs:empty { display: none; }
  #crumbs a { color: #0033cc; text-decoration: none; }
  /* elenchi: il testo segue lo zoom (A-/A+), così si può ingrandire per leggere meglio */
  .row { display: flex; align-items: center; min-height: 2.1rem; padding: .3rem .6rem; font-size: 1.05rem; border-bottom: 1px solid #aaa; color: inherit; text-decoration: none; }
  .row:active { background: #bcd; }
  .row .ic { width: 1.7em; flex: none; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .off { color: #1b5e20; font-size: .6em; margin-left: 8px; flex: none; }
  .row .x { margin-left: 8px; }
  .row input[type=search] { flex: 1; min-width: 0; font-size: 1rem; padding: 4px 8px; }
  .msg { padding: 14px; font-size: 18px; line-height: 1.5; }
  .err { color: #b00020; }
  #fab { position: fixed; top: 6px; right: 6px; z-index: 20; width: 46px; height: 46px; border-radius: 23px; border: 0; background: rgba(60,60,60,.5); color: #fff; display: none; }
  #fab svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; vertical-align: middle; }
  body.nobar #bar, body.nobar #crumbs, body.nobar #info { display: none; }
  body.nobar #fab { display: block; }
  /* documenti */
  #doc { line-height: 1.3; word-wrap: break-word; }
  #doc > div { max-width: none !important; padding: 6px 10px 50px !important; margin: 0 !important; }
  #doc img { max-width: 100%; height: auto; }
  #doc [contenteditable] { outline: 0; background: #fffef0; min-height: 70vh; }
  /* pdf */
  #pdf { padding: 0 0 40px; text-align: left; }
  #pdf .pg { display: block; margin: 0 auto 4px; background: #fff; }
  /* progresso */
  #prog { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #222; color: #fff; padding: 10px; font-size: 16px; display: none; }
  #prog button { float: right; font-size: 16px; }
  /* tema scuro: contrasto pieno */
  html.dark, html.dark body { background: #000; color: #fff; }
  html.dark #bar { background: #111; }
  html.dark #crumbs { background: #111; } html.dark #crumbs a { color: #8ab4f8; }
  html.dark .row { border-color: #444; } html.dark .row:active { background: #1a2a33; }
  html.dark .row .off { color: #7ddc83; }
  html.dark #info { background: #3e3200; color: #ffe08a; }
  html.dark #info button, html.dark .msg button, html.dark .act { background: #333; color: #fff; border-color: #888; }
  html.dark #doc, html.dark #doc * { color: #fff !important; background-color: transparent !important; border-color: #666 !important; }
  html.dark #doc a { color: #7db3ff !important; }
  html.dark #doc [contenteditable] { background-color: #0d0d05 !important; }
  html.dark #pdf .pg { background: #000; }   /* i colori si invertono quando la pagina viene disegnata */
  html.dark .row input[type=search] { background: #222; color: #fff; border: 1px solid #777; }
</style>
</head>
<body>
  <div id="bar">
    <button id="bBack" title="Indietro">&#8592;</button>
    <button id="bHome" title="Home">&#8962;</button>
    <div id="title">Spartiti</div>
    <span id="net" class="on">online</span>
    <button id="bMinus" title="Testo più piccolo" hidden>A&#8722;</button>
    <button id="bPlus" title="Testo più grande" hidden>A+</button>
    <button id="bUpload" title="Carica file qui" hidden>&#8679;</button>
    <button id="bEdit" title="Modifica" hidden>&#9998;</button>
    <button id="bSave" title="Salva su Drive" hidden>Salva</button>
    <button id="bOffline" title="Scarica per l'uso offline" hidden>&#11015;</button>
    <button id="bTheme" title="Chiaro / scuro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="#fff"/></svg></button>
    <button id="bFs" title="Schermo intero"><svg viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button>
  </div>
  <div id="info"></div>
  <div id="crumbs"></div>
  <div id="view"></div>
  <button id="fab" title="Mostra barra"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div id="prog"><button id="progStop">Stop</button><span id="progTxt"></span></div>
  <input type="file" id="file" multiple hidden>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
